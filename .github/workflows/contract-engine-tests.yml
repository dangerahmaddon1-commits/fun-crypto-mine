name: Contract engine tests

on:
  push:
    branches: [main, codex/fcm-mvp-foundation]
  pull_request:
    branches: [main]

jobs:
  contract-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check contract-engine.js && node --check app.js && node --input-type=module --check < member-data.js && node --input-type=module --check < auth.js && node --check adblock.js && node --check api/admin/verify.js
      - name: Run automated tests
        run: node --test tests/*.test.cjs
